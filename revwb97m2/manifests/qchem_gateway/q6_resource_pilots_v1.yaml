route_rationale: >-
  Cases and size coverage come from the existing frozen Step-12 pilot selection.
  The live 2026-09-04 query showed that mhg nodes fit the unchanged 14 and 62
  GiB requests but sbatch predicted September 24 starts. Skill-approved lr8
  test-only checks predicted immediate starts for all three pilots, and its
  approximately 756 GiB nodes are also the only routine route fitting the
  unchanged 557 GiB high-case request. The partition helper was unavailable,
  so live sinfo, sacctmgr, and sbatch test-only data were used according to the
  skill fallback. Only partition/account/QOS changed after route comparison.
