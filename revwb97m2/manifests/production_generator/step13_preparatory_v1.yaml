artifact_state_policy:
  reusable_only_if:
    - completion_marker_present
    - manifest_identity_and_complete_status_match
    - source_record_and_authority_fingerprint_match
    - independent_validation_status_passed
    - validation_pins_manifest_sha256
    - every_declared_artifact_hash_matches
  preserve_and_stop_states:
    - failed_preserved
    - partial_preserved
    - corrupt_preserved
    - stale_authority_preserved
  interrupted_temporary_policy: review_or_resume_without_overwrite
  missing_policy: eligible_only_after_dependencies_and_step12_resources

resource_gate:
  step12_signoff_required: true
  submission_authorized: false
  production_subset: null
  size_tiers: null
  partition_account_qos: null
  cpu_memory_walltime: null
  array_concurrency: null
  retry_limits: null
  direct_or_out_of_core_routes: null
  quantitative_ao_stops: null
  rationale: >-
    These choices depend on the terminal high-cost gateway measurement and
    explicit Step-12 resource sign-off. The preparatory planner must not infer
    them, render SBATCH scripts, or submit work.

forbidden_actions:
  - run_chemistry
  - modify_existing_artifacts
  - delete_failed_partial_or_stale_artifacts
  - choose_or_infer_resources
  - render_or_submit_slurm_jobs
  - authorize_production
