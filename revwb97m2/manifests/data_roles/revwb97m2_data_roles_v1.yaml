    expected_reactions: 1498
    semantics: rows enter the weighted least-squares objective and determine coefficients
  model_selection:
    datasets: all_137_gscdb137_datasets
    expected_reactions: 8377
    granularity: whole_datasets
    metric: dataset_specific_error_then_ner_then_category_and_overall_mean
    may_choose:
      - constraint_profile
      - sparsity
      - functional_design
      - numerical_stability_policy
    caveat: intentionally_COACH_faithful_and_not_an_independent_holdout_from_fitting
  overfitting_diagnostic:
    datasets: [AE11, MB08-165, MB16-43]
    expected_reactions: 219
    metric: mean_of_the_three_dataset_NERs
    may_veto_candidate: true
    may_directly_choose_best_candidate: false
    caveat: MB16-43_is_also_in_the_Cycle-2_coefficient_fitting_set_so_the_diagnostic_is_not_fully_independent
  final_assessment:
    evaluate_once_after_model_and_sparsity_are_frozen: true
    may_change_model: false
    appended_external_reaction_groups:
      datasets: [SC74, OEEFD]
      expected_reactions: 71
      source: revwb97m2/manifests/gscdb137/source/DatasetEval.csv
      geometry_status: available_in_verified_qchem_input_snapshot
    BigNC:
      datasets: [L14, vL11]
      expected_reactions: 25
      expected_species: 75
      species_manifest: revwb97m2/manifests/gscdb137/bignc_species_manifest.csv
      geometry_status: blocked_no_verified_authoritative_qchem_input_snapshot
      rule: do_not_infer_geometry_or_basis_from_orbitals

leakage_policy:
  random_point_level_split_forbidden: true
  role_overlap_must_be_explicit: true
  final_assessment_must_not_influence_any_model_choice: true
  gscdb137_post_freeze_reporting_label: development_domain_assessment_not_untouched_test
  partial_Cycle-2_dataset_remainders: model_selection_only_as_part_of_the_complete_dataset_NER

