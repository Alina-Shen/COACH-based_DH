  maximum_auxiliary_aos: 4500
  maximum_estimated_df_3center_gib_fraction_of_requested_memory: 0.50
  stop_on_parent_nonconvergence: true
  stop_on_any_hash_or_identity_failure: true
  stop_on_slurm_out_of_memory_or_timeout: true
  rationale: >-
    These are gateway measurement limits, not production limits. They allow the
    smallest available counterpoise-ghost species to measure the current route
    while preventing silent expansion to larger BigNC cases before Step-12 sign-off.
