# Scientific configuration specification for the revised omegaB97M(2) practice.
# The current COACH code does not yet consume this complete schema.
schema_version: 1
status: specification_only

project:
  name: revwb97m2
  objective: >-
    Reproduce published omegaB97M(2) energies from self-consistent omegaB97M-V
    orbitals, then refit the linear energy model with the COACH constrained-MIO
    protocol and measure improvement on a locked test set.
  repository_root: /clusterfs/mhg-data/yaoshen/coach-based_dh
  code_root: /clusterfs/mhg-data/yaoshen/coach-based_dh/coach
  project_root: /clusterfs/mhg-data/yaoshen/coach-based_dh/revwb97m2
  generated_data_root: /clusterfs/mhg-data/yaoshen/coach-based_dh_data/revwb97m2
  units:
    stored_energy: hartree
    reported_error: kcal_per_mol
    hartree_to_kcal_per_mol: 627.50947406

provenance:
  parent_method: omegaB97M-V
  target_reference_method: published_omegaB97M(2)
  parent_orbitals_are_fixed_during_fit: true
  final_double_hybrid_is_self_consistent: false
  record_at_runtime:
    - git_commit
    - python_version
    - pyscf_version
    - libxc_version
    - numpy_version
    - scipy_version
    - gurobi_version
    - hostname
    - timestamp

orbital_calculation:
  engine: pyscf
  functional: wb97m-v
  self_consistent: true
  basis: def2-qzvppd
  counterpoise_correction: false
  charge_source: xyz_metadata
  multiplicity_source: xyz_metadata
  reference_policy:
    closed_shell_singlet: RKS
    open_shell: UKS
  convergence:
    energy_tolerance_hartree: 1.0e-9
    maximum_cycles: 200
    require_converged: true
    record_orbital_gradient: true
    stability_analysis: record_and_flag
    use_alternate_solution_automatically: false
  range_separation:
    omega_bohr_inverse: 0.3
    long_range_hf_fraction: 1.0
    short_range_hf_fraction_source: query_parent_functional
    forbid_hardcoded_wb97xv_fraction_0_167: true

# These grids reproduce the published omegaB97M(2) computational convention.
published_reproduction_grids:
  semilocal_xc:
    default:
      radial: 99
      angular: 590
    dataset_overrides:
      AE18:
        radial: 500
        angular: 974
      RG10:
        radial: 500
        angular: 974
  parent_wb97m_v_nonlocal_correlation:
    default:
      scheme: SG-1
    dataset_overrides:
      AE18:
        radial: 75
        angular: 302
      RG10:
        radial: 75
        angular: 302

# These additional unpruned grids belong to the COACH numerical-stability protocol.
coach_feature_grids:
  pruning: none
  radii_adjustment: none
  fitting_reference:
    radial: 250
    angular: 974
    id: "250974"
  practical:
    radial: 99
    angular: 590
    id: "99590"
  coarse_analysis:
    radial: 75
    angular: 302
    id: "75302"

double_hybrid_energy:
  evaluation: non_self_consistent_on_fixed_wb97m_v_orbitals
  range_separation:
    omega_bohr_inverse: 0.3
    long_range_hf_fraction: 1.0
  vv10:
    evaluate_non_self_consistently: true
    b: 10.0
    C: 0.01
    coefficient_is_linear_feature: true
  pt2:
    method: RI-MP2
    amplitudes: canonical_mp2
    frozen_core: true
    auxiliary_basis: auto_match_def2_qzvppd
    denominator_regularization: none
    attenuation: none
    initial_feature: total_pt2_correlation
    save_spin_components_for_diagnostics: true
    fit_spin_components_separately: false
  fixed_energy_terms:
    - nuclear_repulsion
    - one_electron
    - coulomb
    - full_long_range_hf_exchange
  fitted_energy_terms:
    - semilocal_short_range_exchange
    - semilocal_same_spin_correlation
    - semilocal_opposite_spin_correlation
    - short_range_hf_exchange
    - vv10_correlation_b10
    - total_pt2_correlation

feature_models:
  active_for_first_fit: R2_coach291
  models:
    R0_published_wb97m2:
      purpose: regression_reference_only
      coefficients: published
      fit: false
    R2_coach291:
      purpose: test_richer_coach_semilocal_space_and_constraints
      integrated_dv_rows:
        exchange: 64
        same_spin_correlation: 153
        opposite_spin_correlation: 166
      feature_layout:
        exchange:
          start: 0
          stop: 96
        same_spin_correlation:
          start: 96
          stop: 192
        opposite_spin_correlation:
          start: 192
          stop: 288
        short_range_hf: 288
        vv10: 289
        pt2: 290
        total: 291
    R3_optional_scs_pt2:
      enabled: false
      reason: >-
        Separate same-spin and opposite-spin PT2 changes the model class and is
        deferred until R0, R1, and R2 are complete.

constraints:
  coefficient_absolute_bound: 25.0
  mandatory_nonzero_features:
    - short_range_hf
    - pt2
  mandatory_features_count_toward_sparsity: true
  short_range_hf_bounds:
    minimum: 0.0
    maximum: 1.0
  exchange_uniform_electron_gas:
    enabled: true
    equation: "gx(0,0) + c_sr_hf = 1"
  nonlocal_correlation_sum:
    enabled: true
    equation: "c_pt2 + c_vv10 = 1"
  coach_sampled_bounds:
    enabled_for_models:
      - R2_coach291
    exchange_enhancement:
      minimum: 0.0
      maximum: 2.2146
    exchange_one_electron_maximum: 1.479
    same_spin_correlation:
      minimum: -10.0
      maximum: 10.0
    opposite_spin_correlation:
      minimum: -10.0
      maximum: 10.0

grid_sensitivity:
  enabled_in_pass1: false
  enabled_in_pass2: true
  comparison_grid: "99590"
  reference_grid: "250974"
  threshold_kcal_per_mol: 0.015
  selection:
    largest_model_error_rows_per_candidate: 100
    largest_global_row_l1_norms: 200
    deduplicate: true
  zero_difference_features:
    - short_range_hf
    - pt2
  vv10_difference_policy: >-
    Use an evaluated VV10 grid difference only if VV10 is recomputed on both
    comparison grids; otherwise set its difference column to zero and record why.

data_policy:
  reaction_metadata: null
  training_weights: null
  dataset_information: null
  standard_errors: null
  must_set_metadata_paths_before_fit: true
  split_strategy: predefined_by_dataset_or_chemical_family
  save_explicit_split_manifest: true
  forbid_random_point_level_split: true
  test_set_policy: evaluate_once_after_model_and_sparsity_are_frozen
  weighting_policy: identical_across_R0_R2_for_comparison
  counterpoise_correction: false
  failed_species_policy: stop_and_report
  failed_reaction_policy: stop_and_report

optimization:
  solver: gurobi
  objective: weighted_least_squares
  random_seed: 0
  threads: 16
  time_limit_seconds: 7200
  repeats_per_warm_start: 2
  warm_start_pass2_from_pass1: true
  sparsity_scan:
    R2_coach291: [14, 20, 28, 36, 48, 64]
  selection_uses:
    - validation_error
    - grid_stability
    - physical_constraint_margin
    - repeat_stability
    - parameter_count
  selection_must_not_use:
    - final_test_error

validation:
  parent_energy_reconstruction_tolerance_hartree: 1.0e-8
  published_wb97m2_molecular_tolerance_hartree: 1.0e-7
  published_wb97m2_reaction_tolerance_kcal_per_mol: 1.0e-3
  equality_constraint_tolerance: 1.0e-10
  required_identity_tests:
    - wb97m_v_parent_energy_from_components
    - published_wb97m2_energy_from_features
    - reaction_features_from_species_stoichiometry
    - direct_energy_equals_fixed_plus_matrix_times_coefficients
  comparison_models:
    - omegaB97M-V
    - published_omegaB97M(2)
    - R2_coach291

execution_stages:
  - name: smoke
    approximate_species_count: "5-20"
    submit_to_slurm: false
  - name: pilot
    approximate_reaction_count: "100-300"
    submit_to_slurm: false
  - name: production
    submit_to_slurm: true
    require_smoke_and_pilot_success: true

safety:
  overwrite_existing_species_output: false
  write_species_outputs_atomically: true
  require_completion_marker: true
  save_failure_reason: true
  never_store_secrets_in_outputs: true
  production_run_requires_dry_run_first: true
