execution_protocol:
  base_orbital_training_cycles: 0
  source_orbitals: precomputed_self_consistent_qchem_wb97m_v_archives
  parent_method_for_cycle: omegaB97M-V
  update_parent_orbitals_from_fitted_model: false
  fitting_selection_and_weights: updated_coach_si_final_cycle_table_2
  fitting_weight_manifest: revwb97m2/manifests/weights/coach_si_table2_final_cycle_training_weights.csv
  fitting_weight_entries_manifest: revwb97m2/manifests/weights/coach_si_table2_final_cycle_entries.csv
  fitting_weight_validation: revwb97m2/manifests/weights/coach_si_table2_final_cycle_validation.json
  require_validated_machine_readable_weight_manifest_before_fit: true
  numerical_grid_optimization_passes: 2
  pass_1: unconstrained_grid_sensitivity_discovery
  pass_2: selected_grid_difference_constraints
  note: >-
    The two grid passes reuse the same imported Q-Chem archive and do not
    regenerate orbitals or scalar features. The precomputed source orbitals
    represent the single fixed omegaB97M-V parent; this workflow performs zero
    new parent-orbital optimization cycles.

optimization:
  solver: gurobi
  objective: weighted_least_squares
  random_seed: 0
  threads: 16
  time_limit_seconds: 7200
  repeats_per_warm_start: 2
  warm_start_pass2_from_pass1: true
  sparsity_count_includes_mandatory_scalar_features: true
  sparsity_scan:
    R2_coachform_292: [14, 24, 32, 40, 48, 64, 80]
  selection_uses:
    - gscdb137_dataset_and_category_NER
    - overfitting_diagnostic_mean_NER
    - solver_repeat_stability
    - solver_optimality_gap
    - grid_stability
    - dense_domain_factor_audit
    - parameter_count
  selection_must_not_use: [SC74_error, OEEFD_error, BigNC_error, GDB9_W1_F12_error, OPT_error, final_test_error]

validation:
  parent_energy_reconstruction_tolerance_hartree: 1.0e-8
  published_wb97m2_molecular_tolerance_hartree: 1.0e-7
  published_wb97m2_reaction_tolerance_kcal_per_mol: 1.0e-3
  reaction_matrix_identity_tolerance_hartree: 1.0e-12
  equality_constraint_tolerance: 1.0e-10
  cross_engine_parent_tolerance_hartree: 2.0e-6
  cross_engine_scaled_os_rimp2_tolerance_hartree: 5.0e-6
  ri_mp2_vs_conventional_threshold_kcal_per_mol: 0.015
  passed_rimp2_gateway_report: revwb97m2/results/2026-08-29-pyscf-qchem-rimp2-h2o-sw49.json
  passed_data_role_validation: revwb97m2/manifests/data_roles/validation.json
  passed_pyscf_input_validation: /clusterfs/mhg-data/yaoshen/coach-based_dh_data/revwb97m2/authoritative_inputs/pyscf/revwb97m2_all_uks_inputs_v1/validation.json
  passed_basis_bridge_validation: revwb97m2/manifests/basis_bridge/validation.json
  passed_integrated_dv_validation: revwb97m2/manifests/integrated_dv/validation.json
  passed_qchem_orbital_authority_validation: revwb97m2/manifests/qchem_orbitals/validation.json
  required_gates_before_pilot:
    - scientific_specification_schema
    - locked_data_roles_and_qchem_input_metadata
    - qchem_orbital_authority_14006_complete
    - qchem_full_build_and_binary_provenance
    - qchem_archive_copy_hash_identity
    - selected_integrated_dv_features_match_frozen_semantics
    - qchem_integrated_dv_delimiters_shape_and_finite_values
    - qchem_restricted_and_unrestricted_three_grid_gateway
    - qchem_final_complete_block_extractor
    - qchem_same_archive_scalar_feature_identity
    - coach_d4_atm_definition_and_energy_validation
    - independent_open_interval_scalar_coefficient_bounds
    - wb97m_v_parent_energy_from_components
    - published_wb97m2_energy_from_features
    - reaction_features_from_species_stoichiometry
    - direct_energy_equals_fixed_plus_matrix_times_coefficients
  comparison_models:
    - omegaB97M-V
    - published_omegaB97M(2)
    - R2_coachform_292_C0

execution_stages:
  - {name: gateway, approximate_species_count: "5-10", submit_to_slurm: false}
  - {name: real_reaction_smoke, approximate_reaction_count: "20-50", submit_to_slurm: false}
  - {name: mio_pilot, approximate_reaction_count: "100-300", submit_to_slurm: true}
  - {name: production, submit_to_slurm: true, require_all_prior_stages_success: true}

safety:
  overwrite_existing_species_output: false
  write_species_outputs_atomically: true
  require_completion_marker: true
  save_failure_reason: true
  never_store_secrets_in_outputs: true
  production_run_requires_dry_run_first: true
  qchem_orbitals_must_be_used_as_production_inputs: true
  authoritative_qchem_archives_must_not_be_modified: true
  qchem_runs_require_isolated_verified_archive_copy: true
  missing_or_invalid_qchem_archive_must_stop: true
  silent_pyscf_scf_fallback_forbidden: true
  production_qchem_requires_zero_scf_cycles: true
  preserve_qchem_route_backup: true
  qchem_route_code_backup: coach/qchem_orbital_route
  qchem_route_smoke_backup: /clusterfs/mhg-data/yaoshen/coach-based_dh_data/qchem_orbital_route
