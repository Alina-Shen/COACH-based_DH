  pyscf_xc_label: wb97m-v
  self_consistent: true
  fixed_during_feature_generation_and_fitting: true
  qchem_orbitals_are_production_inputs: false
  qchem_role: cross_engine_regression_and_input_metadata_provenance_only
  input_definition:
