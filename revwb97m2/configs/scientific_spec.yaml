# Authoritative scientific specification for the COACH-form revision of omegaB97M(2).
schema_version: 3
status: frozen

scientific_specification:
  name: revwb97m2_coach_form
  version: 3
  frozen_on: "2026-08-29"
  authority: revwb97m2/configs/scientific_spec.yaml
  supersedes: revwb97m2/configs/archive/scientific_spec.v2.yaml
  amendment:
    decision: replace_qchem_orbitals_with_fixed_pyscf_wb97m_v_parents
    reason: >-
      The maintained released COACH data-generation route is PySCF-native.
      The matched h2o_SW49 gateway reproduced the Q-Chem omegaB97M-V parent
      and scaled opposite-spin RIMP2 contribution within 1.3e-8 hartree, and
      PySCF density-fitted UMP2 agreed with conventional UMP2 within the frozen
      0.015 kcal/mol numerical threshold. Q-Chem orbitals are therefore no
      longer production inputs.
    changed_fields:
      - provenance.record_at_runtime
      - orbital_source
      - orbital_source.basis
      - double_hybrid_energy.pt2.auxiliary_basis
      - validation.required_gates_before_pilot
      - execution_protocol
      - safety
  change_control: >-
    Scientific changes require a version increment, a written rationale, and
    rerunning every affected validation gate.

project:
  name: revwb97m2
  objective: >-
    Fit a non-self-consistent double-hybrid energy on fixed omegaB97M-V
    orbitals using the final documented COACH semilocal base energy densities,
    dimensionless variables, correction factors, and polynomial families.
  repository_root: /clusterfs/mhg-data/yaoshen/coach-based_dh
  coach_source_root: /clusterfs/mhg-data/yaoshen/coach-based_dh/coach
  version_controlled_root: /clusterfs/mhg-data/yaoshen/coach-based_dh/revwb97m2
  heavy_data_root: /clusterfs/mhg-data/yaoshen/coach-based_dh_data/revwb97m2
  runtime_environment:
    policy: verified_existing_complete_conda_environment
    module: miniconda3/22.11.1-gcc-11.4.0
    conda_environment_name: coach
    readable_specification: revwb97m2/environment/environment.yml
    exact_linux_conda_lock: revwb97m2/environment/conda-linux-64.explicit.txt
    exact_python_lock: revwb97m2/environment/pip-linux-64.lock.txt
    captured_baseline: revwb97m2/environment/baseline.json
  storage_policy:
    version_controlled:
      - source_code
      - configuration
      - tests
      - small_inputs
      - lightweight_manifests
      - lightweight_result_summaries
      - documentation
      - slurm_submission_scripts
    heavy_data:
      - parent_scf_checkpoints
      - integrated_dv_matrices
      - feature_arrays
      - processed_training_matrices
      - solver_artifacts
      - full_logs
      - runtime_environments
  units:
    stored_energy: hartree
    reported_energy_error: kcal_per_mol
    hartree_to_kcal_per_mol: 627.50947406

provenance:
  parent_method: omegaB97M-V
  parent_orbitals_are_fixed_during_fit: true
  final_double_hybrid_is_self_consistent: false
  record_at_runtime:
    - scientific_specification_version
    - scientific_specification_sha256
    - git_commit
    - input_manifest_sha256
    - parent_checkpoint_sha256
    - python_version
    - pyscf_version
    - libxc_version
    - numpy_version
    - scipy_version
    - gurobi_version
    - hostname
    - timestamp_utc
    - environment_baseline_sha256

