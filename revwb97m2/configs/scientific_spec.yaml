      records: pyscf_input_records.jsonl
      index: pyscf_input_index.csv
      provenance: provenance.json
      validation: validation.json
      checksum_manifest: MANIFEST.sha256
      immutable_marker: IMMUTABLE.json
      manifest_sha256: c4f2d596a5b779bc6bb25d6fb31a2ab79c285374af6388ec960b1461b40238bb
      records_sha256: 2e17d35d5b75a5d282ccb9b9f6619e4f6c13327e8ee9d3b5e5db63cc59905bf0
      record_count: 17658
      energy_role_species: 17452
      opt_geometry_species: 206
      reference_policy: UKS_for_all_species
      basis_bridge_status: pending_step_6_semantic_translation_and_validation
