      provenance: revwb97m2/manifests/basis_bridge/provenance.json
      validation: revwb97m2/manifests/basis_bridge/validation.json
      bridge_module: revwb97m2/scripts/pyscf_basis_bridge.py
      record_count: 17658
      policy_sha256: d4a100fc725af6711604b30a78f8013f62e8841bfc3254c8eaaf875ad772ba98
      resolved_records_sha256: cb6f331cd143ee7f1e4bc15fdaef4863e4bba8f00742f08b156ece1c3223ccb6
      provenance_sha256: 16b997715a0f18746f4d9129dcafb286013fb276fb74ced33c930e830ee4515b
      validation_sha256: 445857ce1b593b03d1db29528cae37e02b6ecfb7f2a26207fb0f2b593d0ced6f
      source_snapshot_remains_immutable: true
      source_snapshot_pending_marker_is_superseded_by_this_overlay: true
      qchem_orbitals_used: false
  basis:
    policy: per_species_from_authoritative_gscdb_manifest
    manifest: revwb97m2/manifests/gscdb137/species_manifest.csv
    species_field: species
    scope_field: scope
    core_scope_value: gscdb137
    basis_field: basis
    require_pyscf_semantic_translation_validation: true
    pyscf_semantic_translation_status: passed_step_6
    pyscf_semantic_translation_validation: revwb97m2/manifests/basis_bridge/validation.json
    translate_generated_basis_and_ecp_sections: true
    forbid_uniform_override: true
    expected_core_species: 13907
    expected_core_distribution:
      def2-QZVPPD: 8276
      AUG-PC-3: 2390
      def2-QZVPP: 2114
      d-aug-cc-pV5Z: 483
      AUG-PC-4: 327
      AUG-CC-PVQZ: 154
      GEN: 61
      aug-cc-pwCVQZ: 29
      aug-cc-pwCVQZ(-PP): 24
      aug-cc-pwCVQZ-PP: 23
      AUG-CC-PCV5Z: 14
      def2-TZVPD: 8
      AUG-CC-PV5Z: 2
      aug-cc-pCV5Z: 2
  counterpoise_correction: false
  charge_source: verified_input_metadata
  multiplicity_source: verified_input_metadata
  reference_policy:
    closed_shell_singlet: unrestricted
    open_shell: unrestricted
    rationale: >-
      The COACH paper and SI do not state an RKS/UKS reference policy. Match
      the maintained COACH PySCF generator, which constructs UKS
      unconditionally, and the released Q-Chem inputs: all 14,006 core and
      all 3,652 AdditionalSets inputs set UNRESTRICTED True. A spin-zero UKS
      result may still converge to equal alpha/beta densities and does not by
      itself imply broken symmetry. Record spin contamination and stability
      for every species.
    evidence:
      maintained_generator: coach/1_data_generation/pyscf_integrated_dv.py
      core_qchem_input_count_unrestricted_true: 14006
      additional_sets_qchem_input_count_unrestricted_true: 3652
      manuscript_and_si_explicit_reference_policy: absent
  range_separation:
    omega_bohr_inverse: 0.3
    long_range_hf_fraction: 1.0
    short_range_hf_fraction_source: query_parent_functional
    expected_short_range_hf_fraction: 0.15
    forbid_hardcoded_wb97xv_fraction_0_167: true
  validation:
    require_expected_species_manifest: true
    require_input_manifest_hash_match: true
    require_parent_energy_reconstruction: true
    require_reference_type_audit: true
    require_open_shell_gateway_case: true
    require_checkpoint_reload_identity: true
    stability_policy: record_and_flag_without_automatic_solution_replacement
    passed_closed_shell_rimp2_gateway: revwb97m2/results/2026-08-29-pyscf-qchem-rimp2-h2o-sw49.json

published_reproduction:
  purpose: regression_only
  semilocal_xc_grids:
    default: {radial: 99, angular: 590}
    dataset_overrides:
      AE18: {radial: 500, angular: 974}
      RG10: {radial: 500, angular: 974}
  parent_wb97m_v_nonlocal_correlation_grids:
    default: {scheme: SG-1}
    dataset_overrides:
      AE18: {radial: 75, angular: 302}
      RG10: {radial: 75, angular: 302}

coach_feature_grids:
  pruning: none
  radii_adjustment: none
  fitting_reference: {radial: 250, angular: 974, id: "250974"}
  practical: {radial: 99, angular: 590, id: "99590"}
  coarse_analysis: {radial: 75, angular: 302, id: "75302"}

double_hybrid_energy:
  evaluation: non_self_consistent_on_fixed_wb97m_v_orbitals
  range_separation:
    omega_bohr_inverse: 0.3
    long_range_hf_fraction: 1.0
  dispersion_policy:
    include_coach_d4_atm: false
    rationale: >-
      D4-ATM belongs to the final COACH hybrid and is not part of the primary
      omegaB97M(2)-style double-hybrid model.
  vv10:
    evaluate_non_self_consistently: true
    b: 10.0
    C: 0.01
    coefficient_is_linear_feature: true
  pt2:
    method: RI-MP2
    amplitudes: canonical_mp2
    frozen_core: true
    auxiliary_basis:
      policy: source_preserving_translation_with_explicit_external_scope_fallbacks
      manifest_advisory_field: aux_basis_corr
      metadata_field: AUX_BASIS_CORR
      translate_generated_aux_basis_sections: true
      require_element_and_shell_coverage_validation: true
      require_pyscf_alias_mapping_validation: true
      named_library_source: /global/home/groups-sw/mhg/qcaux_public/qcaux_6p00/basis
      missing_source_assignments:
        BigNC_external: rimp2-def2-TZVPPD
        GDB9_W1_F12_external: rimp2-def2-TZVP
        OPT_external: rimp2-def2-QZVPPD
      automatic_runtime_auxiliary_basis_generation: forbidden
      bridge_validation: revwb97m2/manifests/basis_bridge/validation.json
    denominator_regularization: none
    attenuation: none
    fitted_feature: total_pt2_correlation
    save_spin_components_for_diagnostics: true
    fit_spin_components_separately: false
  fixed_energy_terms:
    - nuclear_repulsion
    - one_electron
    - coulomb
    - full_long_range_hf_exchange
  fitted_energy_terms:
    - semilocal_short_range_exchange
    - semilocal_same_spin_correlation
    - semilocal_opposite_spin_correlation
    - short_range_hf_exchange
    - vv10_correlation_b10_c001
    - total_pt2_correlation
  nofit_equation: "E_nuclear + E_one_electron + E_coulomb + E_full_lr_hf"

semilocal_model:
  source_of_final_form: coach/FunctionalCOACH/COACH.md
  expansion_terms:
    u: 8
    companion: 12
    tensor_product_terms_per_channel: 96
  exchange:
    integrated_dv_row: 64
    channel_family: range_separated_mgga_with_nonuniform_scaling
    base_energy_density: spin_resolved_ueg_exchange
    correction_factors:
      - short_range_exchange_attenuation_at_omega_0p3
      - nonuniform_scaling
    nonuniform_scaling_equation: "1 - exp(-13.815 / (s_sigma_squared ** 0.25))"
    variables:
      u:
        name: u_x_sigma
        equation: "gamma_x * s_sigma_squared / (1 + gamma_x * s_sigma_squared)"
        gamma: 0.004
        domain: "[0,1]"
        polynomial_family: monomial
      companion:
        name: v_sigma
        equation: "2 * beta_sigma - 1"
        domain: "[-1,1]"
        polynomial_family: legendre
  same_spin_correlation:
    integrated_dv_row: 154
    channel_family: scan_alpha1_same_spin_with_self_correlation_correction
    base_energy_density: scan_alpha1_same_spin
    correction_factors:
      - self_correlation_correction_2_beta_sigma
    variables:
      u:
        name: u_c_ss_sigma
        equation: "gamma_c_ss * s_sigma_squared / (1 + gamma_c_ss * s_sigma_squared)"
        gamma: 0.01
        domain: "[0,1]"
        polynomial_family: monomial
      companion:
        name: v_sigma
        equation: "2 * beta_sigma - 1"
        domain: "[-1,1]"
        polynomial_family: legendre
  opposite_spin_correlation:
    integrated_dv_row: 166
    channel_family: scan_alpha1_opposite_spin
    base_energy_density: >-
      scan_alpha1_total_minus_scan_alpha1_alpha_only_minus_scan_alpha1_beta_only
    correction_factors: []
    variables:
      u:
        name: u_c_os
        equation: "gamma_c_os * s_alpha_beta_squared / (1 + gamma_c_os * s_alpha_beta_squared)"
        gamma: 0.006
        domain: "[0,1]"
        polynomial_family: legendre
      companion:
        name: w_c_os
        equation: "(t_alpha_beta - 1) / (t_alpha_beta + 1)"
        domain: "[-1,1]"
        polynomial_family: legendre
  implementation_gate:
    status: passed_step_7
    test: selected_integrated_dv_features_match_frozen_semantics
    kernel: revwb97m2/integrated_dv.py
    validator: revwb97m2/scripts/validate_integrated_dv.py
    validation_report: revwb97m2/manifests/integrated_dv/validation.json
    output_shape: [3, 96]
    published_coach_coefficients_used: false
    rationale: >-
      The cleaned workflow defaults to same-spin row 153, while the final-form
      documentation specifies Legendre polynomials in v_sigma, which maps to
      row 154. The project-owned kernel directly generates the three selected
      rows with the frozen nonlinear coordinates. Validation concerns the
      COACH feature-construction protocol, not reproduction of the published
      COACH coefficient vector: the target is a new omegaB97M(2)-form fit on
      fixed omegaB97M-V densities.

feature_models:
  active_for_first_real_fit: R2_coachform_291
  models:
    R0_published_wb97m2:
      purpose: regression_reference_only
      coefficients: published
      fit: false
    R2_coachform_291:
      purpose: primary_real_training_model
      integrated_dv_rows:
        exchange: 64
        same_spin_correlation: 154
        opposite_spin_correlation: 166
      feature_layout:
        exchange: {start: 0, stop: 96}
        same_spin_correlation: {start: 96, stop: 192}
        opposite_spin_correlation: {start: 192, stop: 288}
        short_range_hf: 288
        vv10: 289
        pt2: 290
        total: 291
    R3_optional_scs_pt2:
      enabled: false
      reason: >-
        Separate same-spin and opposite-spin PT2 coefficients change the model
        class and are deferred until the total-PT2 model is complete.
  legacy_smoke_baseline:
    model_name: R2_coach291_legacy_smoke
    integrated_dv_rows: [64, 153, 166]
    scientific_training_model: false
    preserve_existing_artifacts: true
    rationale: >-
      Existing H2O and synthetic-reaction smoke artifacts validate plumbing and
      algebra but do not freeze the scientific production basis.

constraint_profiles:
  active_for_first_real_fit: [C0_minimal_critical, C1_nonlocal_sum]
  definitions:
    C0_minimal_critical:
      coefficient_absolute_bound: 25.0
      mandatory_nonzero_features: [short_range_hf, pt2]
      mandatory_features_count_toward_sparsity: true
      short_range_hf_bounds: {minimum: 0.0, maximum: 1.0}
      exchange_uniform_electron_gas:
        enabled: true
        equation: "gx(0,0) + c_sr_hf = 1"
      nonlocal_correlation_sum: {enabled: false}
      exchange_one_electron_bound: {enabled: false}
      sampled_enhancement_bounds: {enabled: false}
    C1_nonlocal_sum:
      extends: C0_minimal_critical
      nonlocal_correlation_sum:
        enabled: true
        equation: "c_pt2 + c_vv10 = 1"
    C2_one_electron:
      extends: C1_nonlocal_sum
      exchange_one_electron_bound:
        enabled: true
        maximum: 1.479
    C3_full_coach_sampled:
      extends: C2_one_electron
      sampled_enhancement_bounds:
        enabled: true
        exchange: {minimum: 0.0, maximum: 2.2146}
        same_spin_correlation: {minimum: -10.0, maximum: 10.0}
        opposite_spin_correlation: {minimum: -10.0, maximum: 10.0}
  policy: >-
    Run C0 and C1 first. Audit fitted factors densely. Add C2 or C3 only to
    address observed pathologies or as a predefined scientific comparison.

grid_sensitivity:
  classification: numerical_not_physical_constraint
  enabled_in_pass1: false
  enabled_in_pass2: true
  reference_grid: "250974"
  comparison_grid: "99590"
  coarse_analysis_grid: "75302"
  threshold_kcal_per_mol: 0.015
  selection:
    largest_model_error_rows_per_candidate: 100
    largest_global_row_l1_norms: 200
    deduplicate: true
  zero_difference_features: [short_range_hf, pt2]
  vv10_difference_policy: >-
    Store a nonzero VV10 grid difference only if VV10 is explicitly evaluated
    on both grids; otherwise store zero and record the reason.

